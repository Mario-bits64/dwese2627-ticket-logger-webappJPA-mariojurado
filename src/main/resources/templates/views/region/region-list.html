<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Ticket Logger - Home')"></head>


<body class="d-flex flex-column h-100">


<!-- Insertar el fragmento del header -->
<header th:replace="fragments/header :: header"></header>


<!-- Contenido dinámico -->
<main class="list-page">
    <div class="list-card">

        <h1 th:text="#{msg.region-list.title}">Lista de Comunidades Autónomas</h1>

        <!-- Botón para añadir -->
        <a th:href="@{/regions/new}" class="btn btn-success" th:text="#{msg.region-list.add}">Añadir Comunidad Autónoma</a>

        <!-- Muestra un mensaje de error si hay algún problema -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Tabla -->
        <table class="table table-bordered table-striped mt-3">
            <thead>
            <tr>
                <th><a th:href="@{/regions(page=${currentPage},size=${pageSize},sortField='id',sortDir=${reverseSortDir})}" th:text="|#{msg.region-list.id} ${sortField == 'id' ? (sortDir == 'asc' ? '▲' : '▼') : ''}|">ID</a></th>
                <th><a th:href="@{/regions(page=${currentPage},size=${pageSize},sortField='code',sortDir=${reverseSortDir})}" th:text="|#{msg.region-list.code} ${sortField == 'code' ? (sortDir == 'asc' ? '▲' : '▼') : ''}|">Código</a></th>
                <th><a th:href="@{/regions(page=${currentPage},size=${pageSize},sortField='name',sortDir=${reverseSortDir})}" th:text="|#{msg.region-list.name} ${sortField == 'name' ? (sortDir == 'asc' ? '▲' : '▼') : ''}|">Nombre</a></th>
                <th th:text="#{msg.region-list.actions}">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="region : ${listRegions}">
                <td th:text="${region.id}"></td>
                <td th:text="${region.code}"></td>
                <td th:text="${region.name}"></td>
                <td>
                    <a th:href="@{/regions/detail(id=${region.id})}" class="btn btn-outline-secondary btn-sm me-1" th:text="#{msg.region-list.viewDetail}"></a>
                    <a th:href="@{/regions/edit(id=${region.id})}" class="btn btn-primary btn-sm" th:text="#{msg.region-list.edit}"></a>

                    <form th:action="@{/regions/delete}" method="post" class="d-inline">
                        <input type="hidden" name="id" th:value="${region.id}" />
                        <button type="submit" class="btn btn-danger btn-sm" th:onclick="|return confirm('#{msg.region-list.confirm}');|" th:text="#{msg.region-list.delete}">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center mt-3" th:if="${totalPages > 0}">
            <span th:text="#{msg.pagination.info(${currentPage + 1}, ${totalPages}, ${totalElements})}"></span>
            <nav th:aria-label="#{msg.pagination.aria.label}"><ul class="pagination mb-0">
                <li class="page-item" th:classappend="${currentPage == 0} ? ' disabled'"><a class="page-link" th:href="@{/regions(page=${currentPage - 1},size=${pageSize},sortField=${sortField},sortDir=${sortDir})}" th:aria-label="#{msg.pagination.prev}">&laquo;</a></li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? ' active'"><a class="page-link" th:text="${i + 1}" th:href="@{/regions(page=${i},size=${pageSize},sortField=${sortField},sortDir=${sortDir})}"></a></li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? ' disabled'"><a class="page-link" th:href="@{/regions(page=${currentPage + 1},size=${pageSize},sortField=${sortField},sortDir=${sortDir})}" th:aria-label="#{msg.pagination.next}">&raquo;</a></li>
            </ul></nav>
        </div>

        <a th:href="@{/}" class="btn btn-secondary" th:text="#{msg.region-form.returnback}">Volver al inicio</a>

    </div>
</main>



<!-- Insertar el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>


<div th:replace="fragments/scripts :: scripts"></div>


</body>
</html>
